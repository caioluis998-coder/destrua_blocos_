<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>BREAKOUT</h1>
  
  <div class="stats">
    <div>Pontuação: <span id="score">0</span></div>
    <div>Vidas: <span id="lives">3</span></div>
  </div>

  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <p class="instructions">Use as setas <strong>Esquerda</strong> e <strong>Direita</strong> ou o <strong>Mouse</strong> para mover a barra. <strong>Colete os power-ups</strong> que caem dos blocos! 🎁</p>

  <script src="script.js"></script>
</body>
</html>
